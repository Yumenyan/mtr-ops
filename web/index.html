<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4a8d">
<title>MTR 運行情報</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-in">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">MTR 運行情報<small>Service Status</small></span></div>
      <nav class="tabs" id="tabs" aria-label="メニュー"></nav>
      <div class="top-right">
        <div class="clock" id="clock" title="ワールド内時刻">--:--</div>
        <button class="icon-btn" id="theme" type="button" aria-label="テーマ切替">◐</button>
      </div>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view" class="view"></main>
</div>
<div id="modal" class="modal" hidden></div>
<script src="js/app.js"></script>
</body>
</html>
