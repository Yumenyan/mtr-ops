<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3eee4">
<title>MTR 運行情報</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">運行情報<small>Service Status</small></span></div>
    <div class="top-right">
      <div class="clock" id="clock" title="ワールド内時刻">--:--</div>
      <button class="icon-btn" id="theme" aria-label="テーマ切替">◐</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <nav class="tabs" id="tabs" aria-label="メニュー"></nav>
  <main id="view" class="view"></main>
</div>
<aside id="sheet" class="sheet" hidden aria-live="polite"></aside>
<script src="js/app.js"></script>
</body>
</html>
